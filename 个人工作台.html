        if (mm) {
          const mt = mealMap[mm[1]] || "lunch";
          const content = mm[2].replace(/[\uff0c,]\s*(\u82b1\u4e86|花费)\s*\d+\.?\d*.*/,"").trim();
          if (content) {
            setMeals(ms => [...ms, {id:"ml"+Date.now(), date:todayStr(), meal:mt, content:content}]);
            mealMatched = mm[1];
            results.push("\ud83c\udf7d\ufe0f \u5df2\u8bb0\u5f55" + mm[1] + ": " + content);
          }
        }

        // ── 2. 记账（支出）──
        let m = t.match(/(?:\u82b1\u4e86|花费|花了)\s*(\d+\.?\d*)/);
        if (!m) m = t.match(/(.{1,8}?)[\uff0c,]\s*\u82b1\u4e86?\s*(\d+\.?\d*)/);
        if (!m && !mealMatched) m = t.match(/(.{1,6}?)\u82b1\u4e86?(\d+\.?\d*)/);
        if (m) {
          const amt = parseFloat(m[2] || m[1]);
          const ctx = m[1] || t;
          let cat = "\u5176\u4ed6";
          if (/\u5403|\u996d|\u9910|\u5348|\u65e9|\u665a|\u5916\u5356|\u5496\u5561|\u5976\u8336|\u9762|\u7c89|\u70eb|\u997c|\u6c34\u679c|\u96f6\u98df/.test(ctx) || mealMatched) cat = "\u9910\u996e";
          else if (/\u8f66|\u6253\u8f66|\u516c\u4ea4|\u5730\u94c1|\u6cb9|\u52a0\u6cb9|\u6ef4\u6ef4/.test(ctx)) cat = "\u4ea4\u901a";
          else if (/\u4e70|\u8d2d|\u8863|\u978b|\u5316\u5986/.test(ctx)) cat = "\u8d2d\u7269";
          else if (/\u7535\u5f71|\u6e38\u620f|\u73a9|KTV|\u5531/.test(ctx)) cat = "\u5a31\u4e50";
          else if (/\u623f\u79df|\u6c34\u7535|\u7f51\u8d39|\u7269\u4e1a/.test(ctx)) cat = "\u5c45\u4f4f";
          else if (/\u836f|\u533b|\u770b\u75c5/.test(ctx)) cat = "\u533b\u7597";
          else if (/\u4e66|\u8bfe|\u57f9\u8bad|\u5b66/.test(ctx)) cat = "\u6559\u80b2";
          if (amt > 0) {
            setFinances(fs => [...fs, {id:"f"+Date.now(), date:todayStr(), type:"expense", amount:amt, category:cat, note:ctx.trim().slice(0,20)}]);
            results.push("\ud83d\udcb0 \u5df2\u8bb0\u5f55\u652f\u51fa: \u00a5" + amt + " (\u5206\u7c7b: " + cat + ")");
          }
        }

        // ── 3. 记账（收入）──
        m = t.match(/(\u5de5\u8d44|\u517c\u804c|\u7406\u8d22|\u7ea2\u5305|\u5956\u91d1|\u6536\u5165).*?(\d+\.?\d*)/);
        if (!m) m = t.match(/(\d+\.?\d*).*?(\u5230\u8d26|\u8d5a|\u6536\u5165)/);
        if (m) {
          const amt = parseFloat(m[2] || m[1]);
          let cat = "\u5176\u4ed6";
          if (/\u5de5\u8d44|\u85aa/.test(t)) cat = "\u5de5\u8d44";
          else if (/\u517c\u804c/.test(t)) cat = "\u517c\u804c";
          else if (/\u7406\u8d22|\u5229\u606f/.test(t)) cat = "\u7406\u8d22";
          else if (/\u7ea2\u5305/.test(t)) cat = "\u7ea2\u5305";
          if (amt > 0) {
            setFinances(fs => [...fs, {id:"f"+Date.now(), date:todayStr(), type:"income", amount:amt, category:cat, note:t.slice(0,20)}]);
            results.push("\ud83d\udcb5 \u5df2\u8bb0\u5f55\u6536\u5165: \u00a5" + amt + " (\u5206\u7c7b: " + cat + ")");
          }
        }

        // ── 4. 运动 ──
        m = t.match(/(\u8dd1\u6b65|\u6e38\u6cf3|\u9a91\u884c|\u529b\u91cf|\u745c\u4f3d|\u6563\u6b65|\u8df3\u7ef3|\u8fd0\u52a8)(\d+)\s*(\u5206\u949f|\u5c0f\u65f6)?/);
        if (m) {
          let dur = parseInt(m[2]);
          if (m[3] === "\u5c0f\u65f6") dur *= 60;
          setExercises(ex => [...ex, {id:"ex"+Date.now(), date:todayStr(), type:m[1], duration:dur, note:""}]);
          results.push("\ud83c\udfc3 \u5df2\u8bb0\u5f55\u8fd0\u52a8: " + m[1] + " " + dur + "\u5206\u949f");
        }

        // ── 5. 待办 ──
        m = t.match(/\u6dfb\u52a0\u5f85\u529e[\uff1a:]\s*(.+)/);
        if (m) {
          setTodos(ts => [...ts, {id:"t"+Date.now(), text:m[1].trim(), date:todayStr(), done:false, priority:"normal", tag:""}]);
          results.push("\u2705 \u5df2\u6dfb\u52a0\u5f85\u529e: " + m[1].trim());
        }

        // ── 6. 心情 ──
        m = t.match(/\u5fc3\u60c5.*?(\u5f00\u5fc3|\u5e73\u9759|\u4e00\u822c|\u4f4e\u843d|\u70e6\u8e81|\u7126\u8651)/);
        if (!m) m = t.match(/\u4eca\u5929.*?(\u5f00\u5fc3|\u5e73\u9759|\u4e00\u822c|\u4f4e\u843d|\u70e6\u8e81|\u7126\u8651)/);
        if (m) {
          const moodMap = {"\u5f00\u5fc3":"\ud83d\ude0a","\u5e73\u9759":"\ud83d\ude0c","\u4e00\u822c":"\ud83d\ude10","\u4f4e\u843d":"\ud83d\ude14","\u70e6\u8e81":"\ud83d\ude24","\u7126\u8651":"\ud83d\ude30"};
          const emoji = moodMap[m[1]] || "";
          setMoods(ms => [{date:todayStr(), mood:emoji, label:m[1], content:""}, ...ms]);
          results.push("\u2728 \u5df2\u8bb0\u5f55\u5fc3\u60c5: " + emoji + " " + m[1]);
        }

        // ── 7. 打卡 ──
        m = t.match(/\u6253\u5361[\uff1a:]\s*(.+)/);
        if (m) {
          const name = m[1].trim();
          const hab = habits.find(h => h.name === name);
          if (hab) {
            const t2 = todayStr();
            const cur = habitCheckins[t2] || [];
            if (!cur.includes(hab.id)) {
              setHabitCheckins(Object.assign({}, habitCheckins, {[t2]: [...cur, hab.id]}));
            }
            results.push("\u2705 \u5df2\u5b8c\u6210\u6253\u5361: " + name);
          } else {
            results.push("\u26a0\ufe0f \u672a\u627e\u5230\u4e60\u60ef\u300c" + name + "\u300d\uff0c\u8bf7\u5148\u5728\u4e60\u60ef\u6253\u5361\u9875\u9762\u6dfb\u52a0");
          }
        }

        // ── 8. 笔记 ──
        m = t.match(/(\u8bb0\u4f4f|\u7b14\u8bb0|\u7075\u611f|\u8bb0\u5f55)[\uff1a:]\s*(.+)/);
        if (m && results.length === 0) {
          const title = m[2].trim().slice(0, 20);
          setNotes(ns => [{id:"n"+Date.now(), type:"idea", title:title, body:m[2].trim(), date:todayStr()}, ...ns]);
          results.push("\ud83d\udcdd \u5df2\u4fdd\u5b58\u7075\u611f\u7b14\u8bb0: " + title);
        }

        if (results.length > 0) return results.join("\n");
        return "\u2753 \u62b1\u6b49\uff0c\u6211\u6ca1\u7406\u89e3\u3002\u4f60\u53ef\u4ee5\u8bd5\u8bd5\uff1a\n\u00b7 \u201c\u5348\u996d\u5403\u4e86\u725b\u8089\u9762\uff0c\u82b1\u4e8625\u201d \u2192 \u996e\u98df+\u8bb0\u8d26\n\u00b7 \u201c\u65e9\u9910\u5496\u5561\uff0c\u82b1\u4e869.9\u201d \u2192 \u996e\u98df+\u8bb0\u8d26\n\u00b7 \u201c\u8dd1\u6b6530\u5206\u949f\u201d \u2192 \u8fd0\u52a8\n\u00b7 \u201c\u6dfb\u52a0\u5f85\u529e\uff1aXX\u201d \u2192 \u5f85\u529e\n\u00b7 \u201c\u5fc3\u60c5\u5f00\u5fc3\u201d \u2192 \u5fc3\u60c5\n\u00b7 \u201c\u6253\u5361\uff1aXX\u201d \u2192 \u6253\u5361\n\u00b7 \u201c\u8bb0\u4f4f\uff1aXX\u201d \u2192 \u7b14\u8bb0";
      };
      const sendAiMessage = () => {
        if (!aiInput.trim()) return;
        const userMsg = aiInput.trim();
        const reply = processAiInput(userMsg);
        setAiMessages(ms => [...ms, {role:"user", text:userMsg}, {role:"ai", text:reply}]);
        setAiInput("");
      };

      // ── Export / Import ──
      const exportData = () => {
        const blob = new Blob([JSON.stringify({todos,checkins,dailys,weeklys,habits,habitCheckins,pomoSessions,exercises,moods,meals,finances,notes,expenseCategories,incomeCategories,navOrder,customExTypes}, null, 2)], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "\u5de5\u4f5c\u53f0\u5907\u4efd_" + todayStr() + ".json";
        a.click();
      };
      const importData = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.todos) setTodos(d.todos);
            if (d.checkins) setCheckins(d.checkins);
            if (d.dailys) setDailys(d.dailys);
            if (d.weeklys) setWeeklys(d.weeklys);
            if (d.habits) setHabits(d.habits);
            if (d.habitCheckins) setHabitCheckins(d.habitCheckins);
            if (d.pomoSessions) setPomoSessions(d.pomoSessions);
            if (d.exercises) setExercises(d.exercises);
            if (d.moods) setMoods(d.moods);
            if (d.meals) setMeals(d.meals);
            if (d.finances) setFinances(d.finances);
            if (d.notes) setNotes(d.notes);
            if (d.expenseCategories) setExpenseCategories(d.expenseCategories);
            if (d.incomeCategories) setIncomeCategories(d.incomeCategories);
            if (d.navOrder) {
              var DEFAULT_CREW2 = {dashboard:"luffy",schedule:"law",habits:"zoro",exercise:"usopp",mood:"chopper",meals:"sanji",finance:"nami",notes:"robin",daily:"ace",weekly:"brook"};
              setNavOrder(d.navOrder.map(function(item){return Object.assign({},item,{crew:DEFAULT_CREW2[item.key]||item.crew});}));
            }
            if (d.customExTypes) setCustomExTypes(d.customExTypes);
          } catch(_) { alert("\u6587\u4ef6\u683c\u5f0f\u9519\u8bef\uff0c\u8bf7\u9009\u62e9JSON\u5907\u4efd\u6587\u4ef6"); }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      // ── Calendar computed ──
      const yr = calDate.getFullYear(), mo = calDate.getMonth();
      const firstDow = new Date(yr, mo, 1).getDay();
      const dim = new Date(yr, mo+1, 0).getDate();
      const prevDim = new Date(yr, mo, 0).getDate();
      const calDays = [];
      for (let i = firstDow-1; i >= 0; i--) calDays.push({d:prevDim-i, cur:false});
      for (let i = 1; i <= dim; i++) calDays.push({d:i, cur:true, date:yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")});
      const rem = (7 - calDays.length % 7) % 7;
      for (let i = 1; i <= rem; i++) calDays.push({d:i, cur:false});

      const weekReps = weeklys.filter(r => r.week === selWeek);

      /* ═══════════════════ RENDER ═══════════════════ */

      const todayMoodEntry = moods.filter(x => x.date === todayStr())[0];
      const greeting = (() => { const h = new Date().getHours(); return h < 6 ? "\u51cc\u6668\u597d" : h < 9 ? "\u65e9\u4e0a\u597d" : h < 12 ? "\u4e0a\u5348\u597d" : h < 14 ? "\u4e2d\u5348\u597d" : h < 18 ? "\u4e0b\u5348\u597d" : "\u665a\u4e0a\u597d"; })();
      const dateLabel = (() => { const d = new Date(); return (d.getMonth()+1) + "\u6708" + d.getDate() + "\u65e5 " + ["\u5468\u65e5","\u5468\u4e00","\u5468\u4e8c","\u5468\u4e09","\u5468\u56db","\u5468\u4e94","\u5468\u516d"][d.getDay()]; })();

      const [navOrder, setNavOrder] = useState([
        {key:"dashboard", icon:"chartBar", label:"\u5de5\u4f5c\u53f0\u6982\u89c8", crew:"luffy"},
        {key:"schedule", icon:"calendar", label:"\u65e5\u7a0b\u7ba1\u7406", crew:"law"},
        {key:"habits", icon:"checkSquare", label:"\u4e60\u60ef\u6253\u5361", crew:"zoro"},
        {key:"exercise", icon:"activity", label:"\u8fd0\u52a8\u8bb0\u5f55", crew:"usopp"},
        {key:"mood", icon:"smile", label:"\u5fc3\u60c5\u65e5\u8bb0", crew:"chopper"},
        {key:"meals", icon:"coffee", label:"\u996e\u98df\u8bb0\u5f55", crew:"sanji"},
        {key:"finance", icon:"dollar", label:"\u8bb0\u8d26", crew:"nami"},
        {key:"notes", icon:"edit", label:"\u8bfb\u4e66\u7b14\u8bb0", crew:"robin"},
        {key:"daily", icon:"fileText", label:"\u5de5\u4f5c\u65e5\u62a5", crew:"ace"},
        {key:"weekly", icon:"book", label:"\u822a\u6d77\u5468\u62a5", crew:"brook"},
      ]);
      const [dragItemKey, setDragItemKey] = useState(null);
      const [dragOverKey, setDragOverKey] = useState(null);
      const handleDragStart = (key) => setDragItemKey(key);
      const handleDragOver = (e, key) => { e.preventDefault(); setDragOverKey(key); };
      const handleDrop = (targetKey) => {
        if (!dragItemKey || dragItemKey === targetKey) { setDragItemKey(null); setDragOverKey(null); return; }
        setNavOrder(prev => {
          const arr = [...prev];
          const fromIdx = arr.findIndex(n => n.key === dragItemKey);
          const toIdx = arr.findIndex(n => n.key === targetKey);
          const [moved] = arr.splice(fromIdx, 1);
          arr.splice(toIdx, 0, moved);
          return arr;
        });
        setDragItemKey(null);
        setDragOverKey(null);
      };
      const handleDragEnd = () => { setDragItemKey(null); setDragOverKey(null); };

      return (
        <div className="h-screen flex overflow-x-hidden" style={{background:"var(--op-cream)"}}>
          {/* Supabase Auth Modal */}
          {_supabase && !supaUser && (
            <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:"rgba(27,40,56,0.85)",backdropFilter:"blur(6px)"}}>
              <div className="op-card p-8 w-full max-w-sm mx-4" style={{background:"#fff",border:"3px solid #2C3E50"}}>
                <div className="text-center mb-6">
                  <div className="text-3xl mb-2">{"\u2693"}</div>
                  <h2 style={{color:"var(--op-deep-blue)",fontWeight:800,fontSize:"1.3rem"}}>{"\u767b\u5f55\u822a\u6d77\u5de5\u4f5c\u53f0"}</h2>
                  <p style={{color:"#8B7355",fontSize:"0.85rem",marginTop:4}}>{"\u767b\u5f55\u540e\u6570\u636e\u81ea\u52a8\u540c\u6b65\u5230\u4e91\u7aef"}</p>
                </div>
                <div className="space-y-3">
                  <input type="email" value={supaEmail} onChange={e=>setSupaEmail(e.target.value)}
                    placeholder={"\u90ae\u7bb1"}
                    className="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm"
                    style={{background:"#FAFAFA"}}/>
                  <input type="password" value={supaPassword} onChange={e=>setSupaPassword(e.target.value)}
                    placeholder={"\u5bc6\u7801"}
                    className="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm"
                    style={{background:"#FAFAFA"}}
                    onKeyDown={e=>{if(e.key==="Enter") supaAuthMode==="login" ? handleSupaLogin() : handleSupaSignup();}}/>
                  {supaAuthError && <p style={{color:"#C0392B",fontSize:"0.8rem"}}>{supaAuthError}</p>}
                  <button onClick={supaAuthMode==="login" ? handleSupaLogin : handleSupaSignup}
                    disabled={supaAuthLoading}
                    className="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition-colors"
                    style={{background: supaAuthLoading ? "#95a5a6" : "var(--op-pirate-red)"}}>
                    {supaAuthLoading ? "\u5904\u7406\u4e2d..." : (supaAuthMode==="login" ? "\u767b \u5f55" : "\u6ce8 \u518c")}
                  </button>
                  <div className="text-center">
                    <button onClick={()=>{setSupaAuthMode(supaAuthMode==="login"?"signup":"login"); setSupaAuthError("");}}
                      className="text-xs underline" style={{color:"var(--op-deep-blue)"}}>
                      {supaAuthMode==="login" ? "\u6ca1\u6709\u8d26\u53f7\uff1f\u70b9\u51fb\u6ce8\u518c" : "\u5df2\u6709\u8d26\u53f7\uff1f\u70b9\u51fb\u767b\u5f55"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {/* Toast */}
          {toast && (
            <div className="fixed top-6 left-1/2 z-50" style={{transform:"translateX(-50%)"}}>
              <div className={"px-5 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 animate-bounce " +
                (toast.type === "ok" ? "bg-emerald-500 text-white" : "bg-amber-500 text-white")}>
                <Icon name={toast.type === "ok" ? "checkSquare" : "alertCircle"} size={16}/>
                {toast.text}
              </div>
            </div>
          )}

          {/* Mobile Header */}
          <div className="mobile-header fixed top-0 left-0 right-0 z-40 items-center justify-between px-4 py-3" style={{display:"none",background:"linear-gradient(135deg,#1B2838 0%,#2C3E50 100%)",boxShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>
            <button onClick={()=>setMobileMenuOpen(!mobileMenuOpen)} style={{background:"none",border:"none",color:"#F4D03F",cursor:"pointer",padding:4}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <h1 style={{color:"#F4D03F",fontSize:"1rem",fontWeight:800,letterSpacing:"0.05em",margin:0}}>{"\u6d77\u8d3c\u5de5\u4f5c\u53f0"}</h1>
            <div style={{width:24}}/>
          </div>

          {/* Mobile Drawer Overlay */}
          {mobileMenuOpen && (
            <div className="mobile-drawer-overlay fixed inset-0 z-50" style={{background:"rgba(0,0,0,0.5)"}} onClick={()=>setMobileMenuOpen(false)}>
              <div className="h-full flex" style={{width:"75%",maxWidth:280}} onClick={e=>e.stopPropagation()}>
                <aside className="w-full text-white flex flex-col overflow-y-auto overflow-x-hidden" style={{background:"linear-gradient(180deg,#1B2838 0%,#2C3E50 100%)"}}>
                  <div className="px-5 py-5 flex items-center gap-3" style={{borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                    <svg width="32" height="32" viewBox="0 0 48 48">
                      <ellipse cx="24" cy="16" rx="18" ry="6" fill="#F4D03F" stroke="#D4AC0D" strokeWidth="1.5"/>
                      <rect x="14" y="10" width="20" height="8" rx="3" fill="#F4D03F" stroke="#D4AC0D" strokeWidth="1.5"/>
                      <rect x="14" y="15" width="20" height="3" fill="#E74C3C"/>
                      <circle cx="24" cy="28" r="10" fill="#FDFEFE" stroke="#2C3E50" strokeWidth="1.5"/>
                      <circle cx="20" cy="26" r="2.5" fill="#2C3E50"/>
                      <circle cx="28" cy="26" r="2.5" fill="#2C3E50"/>
                      <path d="M20 33 L22 31 L24 33 L26 31 L28 33" stroke="#2C3E50" strokeWidth="1.2" fill="none"/>
                      <line x1="10" y1="38" x2="38" y2="42" stroke="#FDFEFE" strokeWidth="3" strokeLinecap="round"/>
                      <line x1="10" y1="42" x2="38" y2="38" stroke="#FDFEFE" strokeWidth="3" strokeLinecap="round"/>
                    </svg>
                    <div>
                      <h1 style={{color:"#F4D03F",fontSize:"1rem",fontWeight:800,letterSpacing:"0.05em"}}>{"\u6d77\u8d3c\u5de5\u4f5c\u53f0"}</h1>
                      <p style={{color:"rgba(255,255,255,0.45)",fontSize:"0.6rem",marginTop:2}}>{greeting} · {dateLabel}</p>
                    </div>
                  </div>
                  <nav className="flex-1 px-3 py-3 space-y-1">
                    {navOrder.map(({key, icon, label, crew}) => (
                      <button key={key}
                        onClick={()=>{setPage(key); setMobileMenuOpen(false);}}
                        className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 " +
                          (page===key ? "text-white shadow-lg" : "text-gray-400")}
                        style={page===key ? {background:"rgba(192,57,43,0.35)"} : {}}>
                        <CrewBadge name={crew} size={28}/>
                        <span className="font-medium">{label}</span>
                      </button>
                    ))}
                  </nav>
                  <div className="p-4" style={{borderTop:"1px solid rgba(255,255,255,0.08)"}}>
                    {supaUser && (
                      <div className="flex items-center gap-2 mb-3 px-1">

                      const angle = (e[1] / total) * 360;
                      const sa = cumAngle; cumAngle += angle;
                      const x1 = cx + r * Math.cos(toRad(sa)), y1 = cy + r * Math.sin(toRad(sa));
                      const x2 = cx + r * Math.cos(toRad(cumAngle)), y2 = cy + r * Math.sin(toRad(cumAngle));
                      const path = "M "+cx+" "+cy+" L "+x1+" "+y1+" A "+r+" "+r+" 0 "+(angle>180?1:0)+" 1 "+x2+" "+y2+" Z";
                      return { path, color: CHART_COLORS[i % CHART_COLORS.length], name: e[0], amount: e[1], pct: Math.round((e[1]/total)*100) };
                    });
                    return (
                      <div className="flex items-center gap-4">
                        <svg viewBox="0 0 100 100" style={{width:110, height:110, flexShrink:0}}>
                          {slices.map((s, i) => (<path key={i} d={s.path} fill={s.color} opacity="0.85"/>))}
                          <circle cx={cx} cy={cy} r="22" fill="white"/>
                          <text x={cx} y={cy-2} textAnchor="middle" fontSize="7" fill="#666" fontWeight="600">{"\u00a5"+total.toFixed(0)}</text>
                          <text x={cx} y={cy+7} textAnchor="middle" fontSize="5" fill="#999">{"\u672c\u6708"}</text>
                        </svg>
                        <div className="space-y-1 flex-1" style={{minWidth:0}}>
                          {slices.map((s, i) => (
                            <div key={i} className="flex items-center gap-1.5">
                              <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{background:s.color}}/>
                              <span className="text-xs text-gray-600 truncate flex-1">{s.name}</span>
                              <span className="text-xs text-gray-400 flex-shrink-0">{s.pct}%</span>
                              <span className="text-xs font-medium text-gray-500 flex-shrink-0" style={{minWidth:"3rem",textAlign:"right"}}>{"\u00a5"+s.amount.toFixed(0)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  };
                  // Monthly expense by category for stacked bar chart
                  const monthCatData = {};
                  const allCats = new Set();
                  finances.filter(x => x.type === "expense").forEach(x => {
                    const ym = x.date.slice(0, 7);
                    if (!monthCatData[ym]) monthCatData[ym] = {};
                    monthCatData[ym][x.category] = (monthCatData[ym][x.category]||0) + x.amount;
                    allCats.add(x.category);
                  });
                  const months = Object.keys(monthCatData).sort();
                  const catList = [...allCats];
                  const monthTotals = months.map(ym => catList.reduce((s,c) => s + (monthCatData[ym][c]||0), 0));
                  const maxMonth = monthTotals.length > 0 ? Math.max(...monthTotals) : 1;
                  return (
                    <div className="space-y-4 mt-6">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                          <h4 className="font-semibold text-gray-700 text-sm mb-4 flex items-center gap-2">
                            <Icon name="chartBar" size={14} className="text-red-400"/>{"\u672c\u6708\u652f\u51fa\u5206\u5e03"}
                          </h4>
                          {renderPie(expEntries, totalExp, "\u672c\u6708\u6682\u65e0\u652f\u51fa")}
                        </div>
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                          <h4 className="font-semibold text-gray-700 text-sm mb-4 flex items-center gap-2">
                            <Icon name="chartBar" size={14} className="text-emerald-400"/>{"\u672c\u6708\u6536\u5165\u5206\u5e03"}
                          </h4>
                          {renderPie(incEntries, totalInc, "\u672c\u6708\u6682\u65e0\u6536\u5165")}
                        </div>
                      </div>
                      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                        <h4 className="font-semibold text-gray-700 text-sm mb-4 flex items-center gap-2">
                          <Icon name="chartBar" size={14} className="text-indigo-400"/>{"\u652f\u51fa\u540c\u671f\u5bf9\u6bd4"}
                        </h4>
                        {months.length === 0 ? (
                          <div className="py-6 text-center text-gray-300">
                            <p className="text-xs">{"\u6682\u65e0\u652f\u51fa\u6570\u636e"}</p>
                          </div>
                        ) : (
                          <div>
                            <svg viewBox={"0 0 " + Math.max(months.length * 90, 360) + " 180"} className="w-full" style={{maxHeight:200}}>
                              {months.map((ym, i) => {
                                const svgW = Math.max(months.length * 90, 360);
                                const barW = Math.max(Math.min(50, (svgW - 60) / months.length - 12), 20);
                                const gap = (svgW - 60) / months.length;
                                const x = 40 + i * gap;
                                const total = monthTotals[i];
                                const totalH = (total / maxMonth) * 110;
                                const isCurMonth = ym === today.slice(0, 7);
                                let cumH = 0;
                                return (
                                  <g key={i}>
                                    {catList.map((cat, ci) => {
                                      const val = monthCatData[ym][cat] || 0;
                                      if (val === 0) return null;
                                      const segH = (val / maxMonth) * 110;
                                      const y = 140 - cumH - segH;
                                      cumH += segH;
                                      return (
                                        <rect key={ci} x={x} y={y} width={barW} height={segH}
                                          rx={cumH === segH ? "4" : "0"} fill={CHART_COLORS[ci % CHART_COLORS.length]} opacity={isCurMonth ? "0.85" : "0.5"}/>
                                      );
                                    })}
                                    <text x={x + barW/2} y={135 - totalH} textAnchor="middle" fontSize="9" fill="#666">{"\u00a5" + total.toFixed(0)}</text>
                                    <text x={x + barW/2} y="160" textAnchor="middle" fontSize="8" fill={isCurMonth ? "#6366f1" : "#999"} fontWeight={isCurMonth ? "600" : "400"}>{ym}</text>
                                  </g>
                                );
                              })}
                              <line x1="30" y1="142" x2={Math.max(months.length * 90, 360) - 10} y2="142" stroke="#e5e7eb" strokeWidth="1"/>
                            </svg>
                            <div className="flex flex-wrap gap-x-4 gap-y-1 mt-3 pt-3 border-t border-gray-50">
                              {catList.map((cat, ci) => (
                                <div key={ci} className="flex items-center gap-1.5">
                                  <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{background:CHART_COLORS[ci % CHART_COLORS.length]}}/>
                                  <span className="text-xs text-gray-500">{cat}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })()}
              </div>
            
            )}

            {/* ──────── NOTES PAGE ──────── */}
            {page === "notes" && (

              <div>
                <div className="flex items-center gap-3 mb-6">
                    <CrewBadge name="robin" size={36}/>
                    <div>
                  <h2 className="text-2xl font-bold text-gray-800">{"\u8bfb\u4e66\u7b14\u8bb0"}</h2>
                  <p className="text-sm text-gray-400 mt-1">{"\u8bb0\u5f55\u8bfb\u4e66\u7b14\u8bb0\u4e0e\u7075\u611f\u60f3\u6cd5"}</p>
                    </div>
                </div>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
                  <div className="flex gap-2 mb-4">
                    <button onClick={()=>setNoteType("reading")}
                      className={"px-4 py-2 rounded-lg text-sm transition-all "+(noteType==="reading"?"bg-indigo-500 text-white shadow":"bg-gray-100 text-gray-600 hover:bg-gray-200")}>
                      {"\u8bfb\u4e66\u7b14\u8bb0"}
                    </button>
                    <button onClick={()=>setNoteType("idea")}
                      className={"px-4 py-2 rounded-lg text-sm transition-all "+(noteType==="idea"?"bg-indigo-500 text-white shadow":"bg-gray-100 text-gray-600 hover:bg-gray-200")}>
                      {"\u7075\u611f\u60f3\u6cd5"}
                    </button>
                  </div>
                  <div className="flex gap-2 mb-3">
                    <input type="date" value={noteDate} onChange={e=>setNoteDate(e.target.value)}
                      className="px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" style={{width:"9rem"}}/>
                  </div>
                  <input value={noteTitle} onChange={e=>setNoteTitle(e.target.value)}
                    placeholder={"\u6807\u9898"}
                    className="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm mb-3 bg-white"/>
                  <textarea value={noteBody} onChange={e=>setNoteBody(e.target.value)}
                    placeholder={"\u5185\u5bb9\u2026\u2026"}
                    className="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm resize-none mb-4" rows="5"/>
                  <div className="flex gap-2">
                    <button onClick={saveNote}
                      className="px-5 py-2.5 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600 transition-colors flex items-center gap-2 font-medium">
                      <Icon name="save" size={14}/>{editNoteId?"\u66f4\u65b0":"\u4fdd\u5b58"}
                    </button>
                    {editNoteId && (
                      <button onClick={()=>{setEditNoteId(null);setNoteTitle("");setNoteBody("");setNoteDate(today);}}
                        className="px-4 py-2.5 bg-gray-100 text-gray-500 rounded-lg text-sm hover:bg-gray-200 transition-colors">
                        {"\u53d6\u6d88\u7f16\u8f91"}
                      </button>
                    )}
                  </div>
                </div>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="px-5 py-4 border-b border-gray-50 flex items-center justify-between">
                    <h4 className="font-semibold text-gray-700 text-sm flex items-center gap-2">
                      {"\u7b14\u8bb0\u5217\u8868"}
                      {noteFilterDate && <span className="text-xs bg-indigo-50 text-indigo-500 px-2 py-0.5 rounded-full">{noteFilterDate}</span>}
                    </h4>
                    <div className="flex items-center gap-2">
                      <input type="date" value={noteFilterDate} onChange={e=>setNoteFilterDate(e.target.value)}
                        className="px-2 py-1 rounded-lg border border-gray-200 text-xs bg-white"/>
                      {noteFilterDate && (
                        <button onClick={()=>setNoteFilterDate("")}
                          className="text-xs text-gray-400 hover:text-red-400 transition-colors px-2 py-1 rounded hover:bg-gray-100">
                          {"\u6e05\u9664"}
                        </button>
                      )}
                    </div>
                  </div>
                  <div className="divide-y divide-gray-50">
                    {filteredNotes.length === 0 ? (
                      <div className="px-5 py-8 text-center text-gray-300">
                        <Icon name="edit" size={30} className="mx-auto mb-2 opacity-30"/>
                        <p className="text-sm">{noteFilterDate ? "\u8be5\u65e5\u671f\u6682\u65e0\u7b14\u8bb0" : "\u6682\u65e0\u7b14\u8bb0"}</p>
                      </div>
                    ) : filteredNotes.map(n => (
                      <div key={n.id} className="px-5 py-4 hover:bg-gray-50 transition-colors group">
                        <div className="flex items-start justify-between mb-1">
                          <div className="flex items-center gap-2">
                            <span className={"text-xs px-2 py-0.5 rounded-full "+(n.type==="reading"?"bg-indigo-50 text-indigo-500":"bg-amber-50 text-amber-500")}>
                              {n.type==="reading"?"\u8bfb\u4e66":"\u7075\u611f"}
                            </span>
                            <h5 className="text-sm font-medium text-gray-700">{n.title}</h5>
                          </div>
                          <div className="flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={()=>editNote(n)} className="text-gray-300 hover:text-indigo-500 transition-colors">
                              <Icon name="edit" size={14}/>
                            </button>
                            <button onClick={()=>removeNote(n.id)} className="text-gray-300 hover:text-red-400 transition-colors">
                              <Icon name="trash" size={14}/>
                            </button>
                          </div>
                        </div>
                        <p className="text-xs text-gray-400 line-clamp-2">{n.body}</p>
                        <p className="text-xs text-gray-300 mt-1">{n.date}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

            )}

                  {/* Footer */}
                  <div className="mt-8 pt-4 border-t border-gray-100 text-center">
                    <p className="text-xs text-gray-300">{"\u6d77\u8d3c\u5de5\u4f5c\u53f0 \u00b7 \u6570\u636e\u81ea\u52a8\u4fdd\u5b58\u4e8e\u672c\u5730\u6d4f\u89c8\u5668 \u00b7 \u652f\u6301\u5bfc\u51faJSON\u5907\u4efd"}</p>
                  </div>
          </main>

          {/* ═══════ Right Sidebar (schedule/habits only) ═══════ */}
          {(page === "schedule" || page === "habits") && (
            <aside className="desktop-right-sidebar w-64 flex-shrink-0 border-l bg-white overflow-y-auto" style={{padding:"2rem 1.25rem", borderColor:"rgba(44,62,80,0.1)"}}>
              <h3 className="font-bold text-sm mb-5 flex items-center gap-2" style={{color:"var(--op-deep-blue)"}}>
                <Icon name="chartBar" size={15} style={{color:"var(--op-pirate-red)"}}/>{"\u4eca\u65e5\u6982\u89c8"}
              </h3>
              <div className="grid grid-cols-2 gap-3 mb-6">
                <div className="op-card p-3 text-center">
                  <p className="text-lg font-bold" style={{color:"var(--op-deep-blue)"}}>{doneC}</p>
                  <p className="text-xs text-gray-400">{"\u5df2\u5b8c\u6210"}</p>
                </div>
                <div className="op-card p-3 text-center">
                  <p className="text-lg font-bold" style={{color:"var(--op-pirate-red)"}}>{todayTodos.length - doneC}</p>
                  <p className="text-xs text-gray-400">{"\u672a\u5b8c\u6210"}</p>
                </div>
                <div className="op-card p-3 text-center">
                  <p className="text-lg font-bold text-emerald-500">{todayTodos.length > 0 ? Math.round((doneC/todayTodos.length)*100) : 0}%</p>
                  <p className="text-xs text-gray-400">{"\u5b8c\u6210\u7387"}</p>
                </div>
                <div className="op-card p-3 text-center">
                  <p className="text-lg font-bold text-indigo-500">{todayMins}</p>
                  <p className="text-xs text-gray-400">{"\u5206\u949f\u4e13\u6ce8"}</p>
                </div>
              </div>
              {habits.length > 0 && (
                <div className="mb-6">
                  <p className="text-xs font-medium text-gray-400 mb-3">{"\u4e60\u60ef\u8fdb\u5ea6"}</p>
                  {habits.map(h => {
                    const done = (habitCheckins[todayStr()] || []).includes(h.id);
                    return (
                      <div key={h.id} className="flex items-center gap-2 mb-2">
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: h.color}}/>
                        <span className={"flex-1 text-xs " + (done ? "line-through text-gray-300" : "text-gray-600")}>{h.name.length > 8 ? h.name.slice(0,8) + ".." : h.name}</span>
                        <span className={"text-xs " + (done ? "text-emerald-500" : "text-gray-300")}>{done ? "\u2713" : "\u2717"}</span>
                      </div>
                    );
                  })}
                </div>
              )}
              <div className="op-card p-3 text-center">
                <p className="text-xs text-gray-400 mb-1">{"\u4eca\u65e5\u4e13\u6ce8"}</p>
                <p className="text-2xl font-bold" style={{color:"var(--op-deep-blue)"}}>{todayMins}</p>
                <p className="text-xs text-gray-400">{"\u5206\u949f"}</p>
              </div>
            </aside>
          )}

          {/* ═══════ AI Chat Floating Panel ═══════ */}
          <div className="fixed" style={{bottom:24,right:24,zIndex:100}}>
            {aiOpen && (
              <div className="bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col mb-3" style={{width:380,height:500}}>
                <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between rounded-t-2xl" style={{background:"linear-gradient(135deg,#10b981,#059669)"}}>
                  <div className="flex items-center gap-2">
                    <span className="text-lg">{"\ud83e\udd16"}</span>
                    <span className="text-sm font-semibold text-white">{"AI\u52a9\u624b"}</span>
                  </div>
                  <button onClick={()=>setAiOpen(false)} className="text-white opacity-70 hover:opacity-100 transition-opacity text-lg">{"\u2715"}</button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3" style={{background:"#f9fafb"}}>
                  {aiMessages.map((msg,i) => (
                    <div key={i} className={"flex "+(msg.role==="user"?"justify-end":"justify-start")}>
                      <div className={"max-w-xs px-3 py-2 rounded-xl text-sm whitespace-pre-line "+(msg.role==="user"?"bg-indigo-500 text-white rounded-br-sm":"bg-white text-gray-700 shadow-sm border border-gray-100 rounded-bl-sm")}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="px-3 py-3 border-t border-gray-100 bg-white rounded-b-2xl">
                  <div className="flex gap-2">
                    <input value={aiInput} onChange={e=>setAiInput(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendAiMessage();}}}
                      placeholder={"\u8f93\u5165\u6d88\u606f\u2026"}
                      className="flex-1 px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white"/>
                    <button onClick={sendAiMessage}
                      className="px-3 py-2 rounded-lg text-white text-sm transition-colors flex-shrink-0" style={{background:"#10b981"}}>
                      {"\u53d1\u9001"}
                    </button>
                  </div>
                </div>
              </div>
            )}
            <button onClick={()=>setAiOpen(!aiOpen)}
              className="w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition-transform hover:scale-110"
              style={{background:"linear-gradient(135deg,#10b981,#059669)",marginLeft:"auto",display:"block"}}>
              {"\ud83d\udcac"}
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════════ Mount ═══════════════════ */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function(){});
      });
    }
  </script>
</body>
</html>
